name: ASTOR Internet S2 0.2.7
on:
  push:
    branches:
      - feature/astor-0.2.7-internet-s2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 4762ad7316dcdec20016ab5985fb46a27902204d
          path: third_party/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm /111 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager unavailable on runner"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /tmp/astor-sdk-licenses.log 2>&1
          result=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$result" -ne 0 ]; then
            tail -n 50 /tmp/astor-sdk-licenses.log
            exit "$result"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android toolchain
        run: '"$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local and Internet regressions
        run: |
          node tests_v025/guardrails.cjs
          node test_web.cjs
          node test_vault_security.cjs
          node test_mnemosyne.cjs
          node test_durable_memory.cjs
          node test_backup_transfer.cjs
          node test_local_ai.cjs
          node test_internet.cjs
          mkdir -p "$RUNNER_TEMP/astor-internet-tests"
          javac -d "$RUNNER_TEMP/astor-internet-tests" app/src/main/java/fr/astor/hades/InternetPolicy.java tests_native/fr/astor/hades/InternetPolicyTest.java
          java -cp "$RUNNER_TEMP/astor-internet-tests" fr.astor.hades.InternetPolicyTest
      - name: Verify interface
        working-directory: tests_ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node test-ui.cjs
      - name: Compile and lint Internet APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug -PastorInternetTest
      - name: Verify signature and prepare test delivery
        run: |
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Astor-0.2.7-Internet-S2-TEST.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ASTOR-0.2.7-Internet-S2-TEST
          path: dist/
          if-no-files-found: error
