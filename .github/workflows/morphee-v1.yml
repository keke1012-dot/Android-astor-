name: ASTOR MORPHEE V1 - isolated checks
on:
  push:
    branches:
      - feature/astor-morphee-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test time, DST and break policy
        run: |
          mkdir -p /tmp/morphee-test
          javac -encoding UTF-8 -d /tmp/morphee-test app/src/main/java/fr/astor/hades/MorpheePolicy.java tests_native/fr/astor/hades/MorpheePolicyTest.java
          java -cp /tmp/morphee-test fr.astor.hades.MorpheePolicyTest
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 4762ad7316dcdec20016ab5985fb46a27902204d
          path: third_party/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm /111 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Android licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /tmp/astor-sdk-licenses.log 2>&1
          result=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$result" -ne 0 ]; then tail -n 50 /tmp/astor-sdk-licenses.log; exit "$result"; fi
      - name: Install Android toolchain
        run: '"$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Compile and lint non-stable test APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug -PastorUnifiedTest
      - name: Prepare isolated test APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Astor-0.2.9.11-Morphee-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Astor-0.2.9.11-Morphee-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/Astor-0.2.9.11-Morphee-TEST.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ASTOR-Morphee-TEST
          path: dist/
          if-no-files-found: error
