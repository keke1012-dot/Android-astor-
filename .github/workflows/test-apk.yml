name: ASTOR Test APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astor-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test conversation, vault and Mnemosyne
        run: |
          node test_web.cjs
          node test_vault_security.cjs
          node test_mnemosyne.cjs
      - name: Test interface
        working-directory: tests_ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node test-ui.cjs
      - name: Test native policies and dictation
        run: |
          mkdir -p "$RUNNER_TEMP/astor-tests"
          javac -d "$RUNNER_TEMP/astor-tests" app/src/main/java/fr/astor/hades/PreferencePolicy.java tests_native/fr/astor/hades/PreferencePolicyTest.java
          java -cp "$RUNNER_TEMP/astor-tests" fr.astor.hades.PreferencePolicyTest
          javac -d "$RUNNER_TEMP/astor-tests" app/src/main/java/fr/astor/hades/VoiceDictation.java $(find tests_voice -name '*.java')
          java -cp "$RUNNER_TEMP/astor-tests" fr.astor.hades.VoiceDictationTest
      - name: Compile and lint test APK
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk'
      - name: Preserve existing test installation
        run: |
          expected='4482f65cfb0e5e0c4defaefb8a539cff96e6a9fc02fcc69e43d666079d72a9fb'
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          mkdir -p dist
          if [ "$actual" = "$expected" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/Astor-Test-0.2.1.2.apk
            echo 'Compatible signature: update Astor Test without uninstalling.' > dist/INSTALLATION.txt
          else
            gradle :app:assembleDebug :app:lintDebug -PastorSeparateTest --no-daemon
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk dist/Astor-Tempest-0.2.1.2.apk
            echo 'Signature différente : installer Astor Tempest à côté de Astor Test. Ne pas désinstaller Astor Test. Son coffre et ses données restent dans cette application. Aucune migration automatique.' > dist/INSTALLATION.txt
          fi
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ASTOR-Test-0.2.1.2-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14

