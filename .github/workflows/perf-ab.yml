name: ASTOR 0.2.6 Performance A/B
on:
  push:
    branches:
      - feature/astor-0.2.6-optimisation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        batch: [32, 64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 4762ad7316dcdec20016ab5985fb46a27902204d
          path: third_party/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm /111 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager unavailable on runner"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /tmp/astor-sdk-licenses.log 2>&1
          result=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$result" -ne 0 ]; then
            tail -n 50 /tmp/astor-sdk-licenses.log
            exit "$result"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android toolchain
        run: '"$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Run JavaScript regression tests
        run: |
          node test_web.cjs
          node test_local_ai.cjs
      - name: Build diagnostic APK
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          if [ "$BATCH" = 64 ]; then
            sed -i "s/arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'/arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DASTOR_OPT_BATCH64=ON', '-DASTOR_PERF_DIAGNOSTICS=ON'/" app/build.gradle
          else
            sed -i "s/arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'/arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DASTOR_PERF_DIAGNOSTICS=ON'/" app/build.gradle
          fi
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: astor-diagnostic-batch-${{ matrix.batch }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
