plugins { id 'com.android.application' }

// Private file lives outside distributable sources. No signing secrets in this project.
def astorSigning = new Properties()
def astorSigningPath = System.getenv('ASTOR_SIGNING_PROPERTIES')
if (astorSigningPath) {
    def privateFile = new File(astorSigningPath)
    if (!privateFile.isFile()) throw new GradleException('Private signing properties file not found')
    privateFile.withInputStream { astorSigning.load(it) }
    for (name in ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']) {
        if (!astorSigning.getProperty(name)) throw new GradleException('Incomplete private signing properties')
    }
}

android {
    namespace 'fr.astor.hades'
    buildFeatures { buildConfig true }
    compileSdk 35
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    defaultConfig {
        // Installed unified identity is immutable, including its historical suffix.
        applicationId 'fr.astor.hades.unified.test.unified029'
        minSdk 30
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O3'; arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DASTOR_OPT_BATCH64=ON' } }
        versionCode 40
        versionName '0.2.9.12-morphee'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        prototype {
            if (!astorSigning.isEmpty()) {
                storeFile file(astorSigning.getProperty('storeFile'))
                storePassword astorSigning.getProperty('storePassword')
                keyAlias astorSigning.getProperty('keyAlias')
                keyPassword astorSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            debuggable false
            applicationIdSuffix project.hasProperty('astorUnifiedTest') ? '.test.morphee02912' : project.hasProperty('astorFilesTest') ? '.test.files028' : project.hasProperty('astorInternetTest') ? '.test.internet0271' : project.hasProperty('astorGlobalTest') ? '.test.global025rc2' : project.hasProperty('astorMemoryTest') ? '.test.mnemosyne' : (project.hasProperty('astorSeparateTest') ? '.test.tempest' : '.test')
            versionNameSuffix '-test'
            manifestPlaceholders = [astorAppLabel: project.hasProperty('astorUnifiedTest') ? 'Astor Morphée 0.2.9.12' : project.hasProperty('astorFilesTest') ? 'Astor Fichiers 0.2.8' : project.hasProperty('astorInternetTest') ? 'Astor Internet 0.2.7.1' : project.hasProperty('astorGlobalTest') ? 'Astor 0.2.5 RC2' : project.hasProperty('astorMemoryTest') ? 'Astor Mémoire' : (project.hasProperty('astorSeparateTest') ? 'Astor Tempest' : 'Astor Test')]
        }
        release {
            manifestPlaceholders = [astorAppLabel: 'Astor Unifiée']
            minifyEnabled false
            debuggable false
            signingConfig astorSigning.isEmpty() ? null : signingConfigs.prototype
        }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

